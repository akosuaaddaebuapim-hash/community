<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>3D Walkable Community</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; }
    canvas { display: block; }
    #instructions {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      font-size: 20px;
      cursor: pointer;
    }
    #instructions p { margin: 10px 0; }
  </style>
</head>
<body>
<div id="instructions">
  <h1>🏙️ 3D Community Test</h1>
  <p>Click to enter</p>
  <p>WASD = Move | Mouse = Look</p>
</div>

<!-- Three.js and Controls -->
<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/examples/js/controls/PointerLockControls.js"></script>

<script>
try {
  // Scene + Renderer
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x87ceeb); // sky

  const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 2000);
  const renderer = new THREE.WebGLRenderer({antialias: true});
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  // Lights
  scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1));
  const sun = new THREE.DirectionalLight(0xffffff, 1);
  sun.position.set(100, 200, 100);
  scene.add(sun);

  // Ground
  const groundGeo = new THREE.PlaneGeometry(2000, 2000);
  const groundMat = new THREE.MeshPhongMaterial({color: 0x55aa55});
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  scene.add(ground);

  // Test Building (so you can SEE something)
  const testGeo = new THREE.BoxGeometry(50, 100, 50);
  const testMat = new THREE.MeshPhongMaterial({color: 0xff0000});
  const testBuilding = new THREE.Mesh(testGeo, testMat);
  testBuilding.position.set(0, 50, -200);
  scene.add(testBuilding);

  // River
  const waterGeo = new THREE.PlaneGeometry(800, 80);
  const waterMat = new THREE.MeshPhongMaterial({color: 0x3399ff, transparent: true, opacity: 0.8});
  const water = new THREE.Mesh(waterGeo, waterMat);
  water.rotation.x = -Math.PI / 2;
  water.position.set(0, 0.1, 0);
  scene.add(water);

  // Controls
  const controls = new THREE.PointerLockControls(camera, document.body);
  const instructions = document.getElementById('instructions');
  instructions.addEventListener('click', () => controls.lock());

  controls.addEventListener('lock', () => { instructions.style.display = 'none'; });
  controls.addEventListener('unlock', () => { instructions.style.display = 'flex'; });

  // Movement
  const velocity = new THREE.Vector3();
  const direction = new THREE.Vector3();
  const move = {forward: false, back: false, left: false, right: false};

  document.addEventListener('keydown', e => {
    if (e.code === 'KeyW') move.forward = true;
    if (e.code === 'KeyS') move.back = true;
    if (e.code === 'KeyA') move.left = true;
    if (e.code === 'KeyD') move.right = true;
  });
  document.addEventListener('keyup', e => {
    if (e.code === 'KeyW') move.forward = false;
    if (e.code === 'KeyS') move.back = false;
    if (e.code === 'KeyA') move.left = false;
    if (e.code === 'KeyD') move.right = false;
  });

  // Camera start position
  camera.position.set(0, 20, 100);

  // Animate
  const clock = new THREE.Clock();
  function animate() {
    requestAnimationFrame(animate);

    const delta = clock.getDelta();
    velocity.x -= velocity.x * 10.0 * delta;
    velocity.z -= velocity.z * 10.0 * delta;

    direction.z = Number(move.forward) - Number(move.back);
    direction.x = Number(move.right) - Number(move.left);
    direction.normalize();

    if (move.forward || move.back) velocity.z -= direction.z * 400.0 * delta;
    if (move.left || move.right) velocity.x -= direction.x * 400.0 * delta;

    controls.moveRight(-velocity.x * delta);
    controls.moveForward(-velocity.z * delta);

    renderer.render(scene, camera);
  }
  animate();

  // Handle resize
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

} catch (err) {
  console.error("⚠️ Error loading scene:", err);
  document.body.innerHTML = "<h1 style='color:red'>Error loading 3D scene. Open browser console for details.</h1>";
}
</script>
</body>
</html>
